name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Validate manifest and locales
        run: |
          node -e "const fs=require('fs');for(const f of ['package.json','locale/zh.json','locale/en.json'])JSON.parse(fs.readFileSync(f,'utf8'));console.log('json ok')"
      - name: Check bundle wiring
        run: |
          node -e "const p=require('./package.json');const assert=require('assert');
          assert.ok(p.dsh && p.dsh.bundle && p.dsh.bundle.patch, 'dsh.bundle.patch missing');
          assert.ok(p.dsh.client && p.dsh.client.platform === 'web', 'dsh.client.platform missing');
          assert.ok(p.engines && p.engines.dsh, 'engines.dsh missing');
          assert.ok(p.files.includes('client.js'), 'client.js not in files');
          console.log('bundle wiring ok')"
